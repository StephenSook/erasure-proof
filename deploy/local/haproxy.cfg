# HAProxy in front of the local 3-node CockroachDB cluster.
# Round-robins SQL connections and ejects a stopped node within seconds via the HTTP ready
# check, so the crdb retry wrapper's reconnect lands on a surviving node during the node-kill
# demo. This stands in for the SQL load balancer CockroachDB Cloud provides.

global
    maxconn 4096

defaults
    mode                tcp
    timeout connect     10s
    timeout client      10m
    timeout server      10m

# Balanced SQL endpoint. The app and the node-kill demo connect here (host port 26260).
listen psql
    bind :26257
    balance roundrobin
    option httpchk GET /health?ready=1
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server roach1 roach1:26257 check port 8080
    server roach2 roach2:26257 check port 8080
    server roach3 roach3:26257 check port 8080

# HAProxy stats (host port 8090) for the on-camera "node ejected" view.
listen stats
    mode http
    bind :8080
    stats enable
    stats uri /
    stats refresh 2s
