[project]
name = "cryptod"
version = "0.1.0"
description = "Crypto, KMS, Vec2Text, and forensics for erasure-proof"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43",
    "boto3>=1.35",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "moto[kms,s3]>=5",
    "httpx>=0.27",
    "boto3-stubs[kms,s3]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptod"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101 (assert) is fine in tests; allow it there.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
