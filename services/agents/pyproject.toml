[project]
name = "erasure-agents"
version = "0.1.0"
description = "Bedrock Claude agents for erasure-proof: a memory writer and a forensics auditor"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "boto3-stubs[bedrock-runtime]>=1.35",
]
# The real GTR embedder needs torch; it is import-guarded so tests and CI do not require it.
ml = [
    "torch",
    "transformers==4.44.2",
    "sentencepiece",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erasure_agents"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
