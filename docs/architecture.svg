<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8b3ae"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7d36"/>
    </marker>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#26f2d5"/>
    </marker>
  </defs>

  <rect width="1280" height="860" fill="#252423"/>
  <text x="40" y="52" fill="#f6f4f2" font-size="26" font-weight="700">erasure-proof: provable crypto-erasure for agent memory</text>
  <text x="40" y="78" fill="#b8b3ae" font-size="14">One database holds relational state, vector memory, and the audit log, so destroy-and-retain commits in ONE serializable transaction.</text>

  <!-- Judge / browser -->
  <rect x="40" y="110" width="200" height="86" rx="8" fill="none" stroke="#05dbe9" stroke-width="2"/>
  <text x="56" y="140" fill="#05dbe9" font-size="15" font-weight="700">Judge's browser</text>
  <text x="56" y="162" fill="#b8b3ae" font-size="12">demo console + /proof/:id</text>
  <text x="56" y="180" fill="#b8b3ae" font-size="12">WebCrypto ECDSA verify, client-side</text>

  <!-- CloudFront -->
  <rect x="300" y="110" width="210" height="86" rx="8" fill="none" stroke="#33b3f1" stroke-width="2"/>
  <text x="316" y="140" fill="#33b3f1" font-size="15" font-weight="700">CloudFront (one URL)</text>
  <text x="316" y="162" fill="#b8b3ae" font-size="12">SPA from private S3 via OAC</text>
  <text x="316" y="180" fill="#b8b3ae" font-size="12">/api/* -&gt; ALB + origin-verify header</text>

  <!-- Fargate task -->
  <rect x="570" y="96" width="250" height="118" rx="8" fill="none" stroke="#ffcc2a" stroke-width="2"/>
  <text x="586" y="124" fill="#ffcc2a" font-size="15" font-weight="700">Fargate task (ARM64, always on)</text>
  <rect x="586" y="136" width="100" height="60" rx="6" fill="none" stroke="#b8b3ae"/>
  <text x="600" y="160" fill="#f6f4f2" font-size="13">api (Go)</text>
  <text x="600" y="178" fill="#b8b3ae" font-size="10.5">crdbpgx retry</text>
  <rect x="700" y="136" width="104" height="60" rx="6" fill="none" stroke="#b8b3ae"/>
  <text x="712" y="160" fill="#f6f4f2" font-size="13">cryptod (Py)</text>
  <text x="712" y="178" fill="#b8b3ae" font-size="10.5">AES-GCM, ECDSA</text>

  <!-- CockroachDB -->
  <rect x="440" y="290" width="520" height="240" rx="10" fill="none" stroke="#8dff55" stroke-width="2.5"/>
  <text x="460" y="322" fill="#8dff55" font-size="17" font-weight="700">CockroachDB Cloud (system of record)</text>
  <rect x="460" y="340" width="230" height="76" rx="6" fill="none" stroke="#33b3f1"/>
  <text x="472" y="362" fill="#33b3f1" font-size="13" font-weight="700">agent_memory</text>
  <text x="472" y="380" fill="#b8b3ae" font-size="11">ciphertext-only durable embedding</text>
  <text x="472" y="396" fill="#b8b3ae" font-size="11">C-SPANN index + RLS per subject</text>
  <rect x="710" y="340" width="230" height="76" rx="6" fill="none" stroke="#ff7d36"/>
  <text x="722" y="362" fill="#ff7d36" font-size="13" font-weight="700">subject_keys</text>
  <text x="722" y="380" fill="#b8b3ae" font-size="11">one KMS-wrapped key per subject</text>
  <text x="722" y="396" fill="#b8b3ae" font-size="11">DELETE here = the crypto-shred</text>
  <rect x="460" y="432" width="230" height="76" rx="6" fill="none" stroke="#8dff55"/>
  <text x="472" y="454" fill="#8dff55" font-size="13" font-weight="700">decision_log (append-only)</text>
  <text x="472" y="472" fill="#b8b3ae" font-size="11">hash chain + RFC 6962 Merkle tree</text>
  <text x="472" y="488" fill="#b8b3ae" font-size="11">retained under AI Act Art 19</text>
  <rect x="710" y="432" width="230" height="76" rx="6" fill="none" stroke="#26f2d5"/>
  <text x="722" y="454" fill="#26f2d5" font-size="13" font-weight="700">erasure_record</text>
  <text x="722" y="472" fill="#b8b3ae" font-size="11">signed proof body + signature</text>
  <text x="722" y="488" fill="#b8b3ae" font-size="11">s3:// proof anchor reference</text>

  <!-- erasure txn callout -->
  <rect x="40" y="330" width="330" height="160" rx="10" fill="none" stroke="#ff7d36" stroke-width="2.5"/>
  <text x="56" y="360" fill="#ff7d36" font-size="15" font-weight="700">THE erasure transaction</text>
  <text x="56" y="384" fill="#f6f4f2" font-size="12.5">ONE serializable txn (40001-retried):</text>
  <text x="56" y="404" fill="#b8b3ae" font-size="12">1. append decision_log row (hash chain)</text>
  <text x="56" y="422" fill="#b8b3ae" font-size="12">2. DELETE the subject's wrapped key</text>
  <text x="56" y="440" fill="#b8b3ae" font-size="12">3. NULL the live vector, record erasure</text>
  <text x="56" y="464" fill="#f6f4f2" font-size="12.5">destroy AND retain, both or neither</text>
  <line x1="370" y1="410" x2="440" y2="410" stroke="#ff7d36" stroke-width="2" marker-end="url(#arrO)"/>

  <!-- AWS row -->
  <rect x="40" y="580" width="280" height="110" rx="8" fill="none" stroke="#ff7d36" stroke-width="2"/>
  <text x="56" y="608" fill="#ff7d36" font-size="15" font-weight="700">AWS KMS</text>
  <text x="56" y="630" fill="#b8b3ae" font-size="12">GenerateDataKey, subject_id bound as</text>
  <text x="56" y="646" fill="#b8b3ae" font-size="12">encryption context; imported-material</text>
  <text x="56" y="662" fill="#b8b3ae" font-size="12">CMK = second kill switch (delete material)</text>

  <rect x="350" y="580" width="280" height="110" rx="8" fill="none" stroke="#26f2d5" stroke-width="2"/>
  <text x="366" y="608" fill="#26f2d5" font-size="15" font-weight="700">S3 Object Lock (WORM)</text>
  <text x="366" y="630" fill="#b8b3ae" font-size="12">every erasure proof: ECDSA P-256 signed,</text>
  <text x="366" y="646" fill="#b8b3ae" font-size="12">Merkle root + tree size inside the</text>
  <text x="366" y="662" fill="#b8b3ae" font-size="12">signature, retention-locked object</text>

  <rect x="660" y="580" width="280" height="110" rx="8" fill="none" stroke="#b7ff54" stroke-width="2"/>
  <text x="676" y="608" fill="#b7ff54" font-size="15" font-weight="700">Amazon Bedrock (Claude)</text>
  <text x="676" y="630" fill="#b8b3ae" font-size="12">memory-writer agent distils facts;</text>
  <text x="676" y="646" fill="#b8b3ae" font-size="12">forensics agent proves erasure through</text>
  <text x="676" y="662" fill="#b8b3ae" font-size="12">4 read-only tools, verdict + trace</text>

  <!-- Right column: verification paths -->
  <rect x="990" y="110" width="250" height="150" rx="8" fill="none" stroke="#26f2d5" stroke-width="2"/>
  <text x="1006" y="138" fill="#26f2d5" font-size="15" font-weight="700">Independent verification</text>
  <text x="1006" y="160" fill="#b8b3ae" font-size="12">Managed MCP Server</text>
  <text x="1006" y="176" fill="#b8b3ae" font-size="12">(cockroachlabs.cloud/mcp): chain head</text>
  <text x="1006" y="192" fill="#b8b3ae" font-size="12">read without trusting our API layer,</text>
  <text x="1006" y="208" fill="#b8b3ae" font-size="12">least-privilege service account,</text>
  <text x="1006" y="224" fill="#b8b3ae" font-size="12">audit-logged by CockroachDB Cloud</text>

  <rect x="990" y="290" width="250" height="140" rx="8" fill="none" stroke="#f9f640" stroke-width="2"/>
  <text x="1006" y="318" fill="#f9f640" font-size="15" font-weight="700">Three IAM principals</text>
  <text x="1006" y="340" fill="#b8b3ae" font-size="12">role-eraser: KMS only, context-gated</text>
  <text x="1006" y="356" fill="#b8b3ae" font-size="12">role-anchor: proof writes, bypass denied</text>
  <text x="1006" y="372" fill="#b8b3ae" font-size="12">role-inference: Bedrock invoke only</text>
  <text x="1006" y="394" fill="#b8b3ae" font-size="12">no single credential can destroy a key</text>
  <text x="1006" y="410" fill="#b8b3ae" font-size="12">AND write a proof</text>

  <rect x="990" y="460" width="250" height="140" rx="8" fill="none" stroke="#00ffaa" stroke-width="2"/>
  <text x="1006" y="488" fill="#00ffaa" font-size="15" font-weight="700">Durability lab (local)</text>
  <text x="1006" y="510" fill="#b8b3ae" font-size="12">3-node cluster + HAProxy: kill a node</text>
  <text x="1006" y="526" fill="#b8b3ae" font-size="12">mid-demo, the committed erasure and</text>
  <text x="1006" y="542" fill="#b8b3ae" font-size="12">the retained log survive via Raft</text>
  <text x="1006" y="564" fill="#b8b3ae" font-size="12">(cloud nodes cannot be killed by us;</text>
  <text x="1006" y="580" fill="#b8b3ae" font-size="12">same SQL, same retry semantics)</text>

  <!-- Vec2Text note -->
  <rect x="40" y="720" width="900 " height="100" rx="8" fill="none" stroke="#ff4b4b" stroke-width="2"/>
  <text x="56" y="748" fill="#ff4b4b" font-size="15" font-weight="700">Why crypto-shredding: the embedding IS the data</text>
  <text x="56" y="770" fill="#b8b3ae" font-size="12">Vec2Text inverts a GTR-base embedding back to the exact sentence (name recovered verbatim; recorded golden run, reproducible). After key</text>
  <text x="56" y="786" fill="#b8b3ae" font-size="12">destruction the same ciphertext decrypts to InvalidTag and the vector is gone: NIST SP 800-88 Rev. 2 cryptographic erase, conditions stated in SECURITY.md.</text>
  <text x="56" y="806" fill="#f6f4f2" font-size="12">The live InvalidTag failure is the proof; the inversion is the recorded, honestly-labeled illustration.</text>

  <!-- arrows -->
  <line x1="240" y1="153" x2="300" y2="153" stroke="#b8b3ae" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="510" y1="153" x2="570" y2="153" stroke="#b8b3ae" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="695" y1="214" x2="695" y2="290" stroke="#b8b3ae" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="180" y1="580" x2="700" y2="480" stroke="none"/>
  <line x1="180" y1="580" x2="180" y2="490" stroke="none"/>
  <line x1="752" y1="214" x2="180" y2="580" stroke="none"/>
  <line x1="752" y1="200" x2="752" y2="340" stroke="none"/>
  <path d="M 752 214 C 752 260, 300 540, 200 580" fill="none" stroke="#ff7d36" stroke-width="1.6" marker-end="url(#arrO)"/>
  <path d="M 790 214 C 800 300, 560 540, 500 580" fill="none" stroke="#26f2d5" stroke-width="1.6" marker-end="url(#arrC)"/>
  <line x1="800" y1="580" x2="800" y2="214" stroke="none"/>
  <path d="M 800 580 C 810 400, 810 300, 806 214" fill="none" stroke="#b7ff54" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="990" y1="185" x2="880" y2="290" stroke="#26f2d5" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrC)"/>
  <line x1="120" y1="196" x2="120" y2="330" stroke="#05dbe9" stroke-width="1.6" stroke-dasharray="5 4"/>

  <text x="40" y="845" fill="#7a756f" font-size="11">erasure-proof, CockroachDB x AWS Build with Agentic Memory 2026. Full contract: ARCHITECTURE.md, SECURITY.md, COMPLIANCE.md.</text>
</svg>
