# Weekly dependency updates, grouped so a single PR covers an ecosystem rather than opening one per
# package. Grouped minor and patch updates keep the review cost proportionate to the risk.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /services/api
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      mobile-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /services/cryptod
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
