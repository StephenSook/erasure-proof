# Nightly verification of the CLOUD-side claims, run where a PR gate cannot honestly live:
# both jobs depend on external services (cockroachlabs.cloud), so gating every PR on them would
# trade real signal for external-availability flakes. Nightly + dispatch + main pushes touching
# the scripts keeps them CI-run gates without poisoning PR CI.
#
# Job 1 proves the Managed MCP Server path: the full streamable-HTTP handshake and a select_query
# reading the decision-log chain head through cockroachlabs.cloud/mcp, authenticated as the
# least-privilege service account. Job 2 proves two RBAC boundaries live: the control-plane
# 200-vs-403 split on one key, and the data-plane 42501 append-only denial from the database
# itself. Offset cron minute per scheduler-throttling guidance; a failed run emails the owner.
#
# Job 3 (judge-path) answers the question uptime monitoring cannot: the Route53 health check and
# the keepalive both assert /healthz, so the app can read green while a JUDGED BEAT has silently
# degraded, most plausibly the live agent falling back to the recorded verdict when the
# scale-to-zero GPU worker is unreachable. That failure is invisible to every other monitor and a
# judge would be the first to see it. This job runs the same loop the Autopilot button runs and
# asserts on the server's own evidence, not on model prose.

name: verify-cloud

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "infra/ccloud/**"
      - "infra/judge-path-verify.sh"
      - ".github/workflows/verify-cloud.yml"

permissions:
  contents: read

jobs:
  managed-mcp:
    runs-on: ubuntu-latest
    if: github.repository == 'StephenSook/erasure-proof'
    steps:
      - uses: actions/checkout@v4
      - name: Chain head through cockroachlabs.cloud/mcp
        env:
          CCLOUD_SA_API_KEY: ${{ secrets.CCLOUD_SA_API_KEY }}
        run: |
          set -euo pipefail
          bash infra/ccloud/mcp-verify.sh | tee /tmp/mcp-verify.out
          grep -q "PASS: chain head read through cockroachlabs.cloud/mcp" /tmp/mcp-verify.out

  rbac-boundaries:
    runs-on: ubuntu-latest
    if: github.repository == 'StephenSook/erasure-proof'
    steps:
      - uses: actions/checkout@v4
      - name: Install cockroach binary (data-plane boundary needs the SQL client)
        run: |
          set -euo pipefail
          curl -fsSL https://binaries.cockroachdb.com/cockroach-v25.2.3.linux-amd64.tgz | tar xz
          sudo cp cockroach-v25.2.3.linux-amd64/cockroach /usr/local/bin/
      - name: Control-plane 200-vs-403 and data-plane 42501
        env:
          CCLOUD_SA_API_KEY: ${{ secrets.CCLOUD_SA_API_KEY }}
          CRDB_DSN_AGENT_WORKER: ${{ secrets.CRDB_DSN_AGENT_WORKER }}
        run: |
          set -euo pipefail
          bash infra/ccloud/rbac-demo.sh | tee /tmp/rbac.out
          grep -q "PASS: same key, 200 on its scoped cluster" /tmp/rbac.out
          grep -q "PASS: SQLSTATE 42501" /tmp/rbac.out

  judge-path:
    # Skips itself rather than failing when JUDGE_URL is unset (before deploy, or on a fork), so a
    # missing secret never looks like a broken judge path. The URL is judge-only per the
    # organizers, so it is a SECRET, not a variable: Actions logs on this public repo are public,
    # and secrets are exact-value masked.
    runs-on: ubuntu-latest
    if: github.repository == 'StephenSook/erasure-proof'
    steps:
      - uses: actions/checkout@v4
      - name: Exercise the judged path end to end
        env:
          JUDGE_URL: ${{ secrets.JUDGE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${JUDGE_URL:-}" ]; then
            echo "JUDGE_URL secret is not set; skipping the judge-path check."
            exit 0
          fi
          bash infra/judge-path-verify.sh | tee /tmp/judge-path.out
          # The script already exits non-zero on any failed assertion. Gate on the final line too,
          # so a future edit that returns 0 early cannot silently pass this job.
          grep -q "^PASS: judge path healthy" /tmp/judge-path.out
