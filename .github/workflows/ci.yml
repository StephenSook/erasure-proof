name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: AI-tone (no em-dashes in tracked text)
        run: |
          # match the em-dash by its UTF-8 bytes so this file stays em-dash-free itself
          if git grep -nI $'\xe2\x80\x94' -- ':!LICENSE' ':!*.svg'; then
            echo "::error::em-dash found; replace per the AI-tone rule"
            exit 1
          fi
          echo "ai-tone clean"
      - name: Secret scan (gitleaks, full history)
        # Run the binary directly (no GitHub API, no PR-comment permissions) so it works on a
        # private repo with the default read-only token. `detect` scans the full git history.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:latest \
            detect --redact --no-banner

  cryptod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cryptod
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]" numpy
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Types (mypy)
        run: uv run mypy src
      - name: Tests (pytest + hypothesis)
        run: uv run pytest -q

  agents:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agents
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Types (mypy)
        run: uv run mypy src
      - name: Tests (pytest, all mocked; no AWS or DB)
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Lint (eslint)
        run: npm run lint
      - name: Tests (vitest)
        run: npm run test
      - name: Build (vite)
        run: npm run build

  e2e:
    # A real browser drives the whole erasure loop in mock mode on every push: store -> leak ->
    # erase -> browser-verify the ECDSA proof + transparency panel, plus the wrong-subject replay
    # guard. Catches console regressions the unit tests cannot.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (Playwright, mock mode)
        run: npm run e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  go-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Start CockroachDB for the integration test
        run: |
          docker run -d --name crdb -p 26257:26257 \
            cockroachdb/cockroach:latest-v25.2 start-single-node --insecure
          for i in $(seq 1 40); do
            if docker exec crdb ./cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec crdb ./cockroach sql --insecure -e "CREATE DATABASE erasure_test"
      - name: Tests (with the erasure integration + retry-injection tests)
        env:
          CRDB_DSN_TEST: postgresql://root@localhost:26257/erasure_test?sslmode=disable
        run: go test -race ./...

  mcpserver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mcpserver
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Types (mypy)
        run: uv run mypy src
      - name: Start CockroachDB for the tool tests
        run: |
          docker run -d --name crdb-mcp -p 26257:26257 \
            cockroachdb/cockroach:latest-v25.2 start-single-node --insecure
          for i in $(seq 1 40); do
            if docker exec crdb-mcp ./cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec crdb-mcp ./cockroach sql --insecure -e "CREATE DATABASE erasure_test"
      - name: Tests (gate, chain, and the four tools)
        env:
          CRDB_DSN_TEST: postgresql://root@localhost:26257/erasure_test?sslmode=disable
        run: uv run pytest -q

  db-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start single-node CockroachDB
        # A services: block cannot pass the required start command to the cockroach image,
        # so we start it as a step and poll readiness.
        run: |
          docker run -d --name crdb -p 26257:26257 -p 8080:8080 \
            cockroachdb/cockroach:latest-v25.2 start-single-node --insecure
          for i in $(seq 1 40); do
            if docker exec crdb ./cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1; then
              echo "crdb ready"; break
            fi
            sleep 2
          done
      - name: Apply migrations (schema is valid CockroachDB SQL)
        run: |
          docker exec crdb ./cockroach sql --insecure -e "CREATE DATABASE erasure"
          for f in db/migrations/0*.sql; do
            echo "== applying $f =="
            docker exec -i crdb ./cockroach sql --insecure -d erasure < "$f"
          done
      - name: Append-only decision log holds against agent_worker
        run: |
          # As agent_worker: INSERT must succeed (append), UPDATE and DELETE must be denied.
          # Byte literals (x'..') avoid sha256() which returns a hex string, not BYTES.
          echo "-- agent_worker INSERT should succeed --"
          docker exec -i crdb ./cockroach sql --insecure -d erasure -u agent_worker <<'SQL'
          INSERT INTO decision_log (seq, subject_hash, action, lawful_basis, prev_hash, hash)
            VALUES (1, x'0011', 'ingest', 'gdpr_art_17', x'00', x'0022');
          SQL
          for op in "UPDATE decision_log SET action = 'tamper' WHERE seq = 1" \
                    "DELETE FROM decision_log WHERE seq = 1"; do
            echo "-- expect a permission error: $op --"
            if docker exec -i crdb ./cockroach sql --insecure -d erasure -u agent_worker \
                -e "$op" 2>&1 | tee /tmp/o | grep -qi "permission\|denied\|does not have"; then
              echo "correctly denied to agent_worker"
            else
              echo "::error::agent_worker was able to run: $op"; cat /tmp/o; exit 1
            fi
          done
      - name: Operator role can run the erasure's locking read (SELECT FOR UPDATE)
        # Regression: CockroachDB requires UPDATE privilege for SELECT ... FOR UPDATE, and the
        # erasure transaction opens with one on subject_keys. The Go tests run as root, so only a
        # role-scoped check catches a missing grant (found live in the full-stack local run).
        run: |
          docker exec -i crdb ./cockroach sql --insecure -d erasure <<'SQL'
          INSERT INTO subject_keys (subject_id, wrapped_key, kms_key_arn, key_origin, wrapped_key_fingerprint)
            VALUES ('11111111-2222-4333-8444-555555555555', x'01', 'arn:test', 'GENERATE_DATA_KEY', x'aa');
          SQL
          echo "-- as operator: the erasure's opening locking read must succeed --"
          if docker exec -i crdb ./cockroach sql --insecure -d erasure -u operator -e \
            "SELECT wrapped_key_fingerprint FROM subject_keys WHERE subject_id = '11111111-2222-4333-8444-555555555555' FOR UPDATE" \
            2>&1 | tee /tmp/o | grep -qi "does not have\|permission\|denied"; then
            echo "::error::operator lacks the privilege for SELECT FOR UPDATE on subject_keys"; cat /tmp/o; exit 1
          fi
          echo "operator locking read OK"
      - name: RLS scopes the agent role per subject (0004)
        # The whole matrix: fail-closed with no declared subject, own-subject-only reads, denied
        # cross-subject writes, and unrestricted operator/forensics access.
        run: |
          q() { docker exec crdb ./cockroach sql --insecure -d erasure -u "$1" --format=csv -e "$2"; }
          docker exec crdb ./cockroach sql --insecure -d erasure -e "
            INSERT INTO agent_memory (subject_id, content_ciphertext, embedding_ciphertext, nonce_content, nonce_embedding, wrapped_key)
            VALUES ('11111111-1111-4111-8111-111111111111', x'01', x'02', x'03', x'04', x'05'),
                   ('22222222-2222-4222-8222-222222222222', x'01', x'02', x'03', x'04', x'05');"
          echo "-- agent with NO declared subject sees nothing (fail-closed) --"
          q agent_worker "SELECT count(*) FROM agent_memory" | grep -qx "0" || { echo "::error::agent saw rows without declaring a subject"; exit 1; }
          echo "-- agent scoped to subject 1 sees exactly its row --"
          q agent_worker "SET app.subject_id='11111111-1111-4111-8111-111111111111'; SELECT count(*) FROM agent_memory" | grep -qx "1" || { echo "::error::agent did not see exactly its subject's rows"; exit 1; }
          echo "-- agent writing for ANOTHER subject is denied --"
          if q agent_worker "SET app.subject_id='11111111-1111-4111-8111-111111111111'; INSERT INTO agent_memory (subject_id, content_ciphertext, embedding_ciphertext, nonce_content, nonce_embedding, wrapped_key) VALUES ('22222222-2222-4222-8222-222222222222', x'01', x'02', x'03', x'04', x'05')" 2>&1 | grep -q "42501\|policy"; then
            echo "cross-subject write correctly denied"
          else
            echo "::error::agent wrote a row for another subject"; exit 1
          fi
          echo "-- operator and forensics_reader see all rows --"
          q operator "SELECT count(*) FROM agent_memory" | grep -qx "2" || { echo "::error::operator view restricted"; exit 1; }
          q forensics_reader "SELECT count(*) FROM agent_memory" | grep -qx "2" || { echo "::error::forensics view restricted"; exit 1; }
          echo "RLS matrix OK"

  e2e-realstack:
    # The whole loop, ZERO mocks: a real browser drives store -> C-SPANN search -> AS OF SYSTEM
    # TIME -> SERIALIZABLE erasure -> ECDSA sign + S3 Object Lock anchor -> browser proof verify ->
    # 42501 RBAC denial, wired over real HTTP + SQL + crypto. AWS is moto-server (fake KMS + S3), so
    # nothing is billed; the Modal GPU and Bedrock paths stay unwired (the inversion serves its
    # recorded golden run). Proves "everything is actually wired" on every push.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start CockroachDB, apply migrations, enable rangefeeds
        run: |
          docker run -d --name crdb -p 26257:26257 \
            cockroachdb/cockroach:latest-v25.2 start-single-node --insecure
          for i in $(seq 1 40); do
            docker exec crdb ./cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec crdb ./cockroach sql --insecure -e "CREATE DATABASE erasure"
          docker exec crdb ./cockroach sql --insecure -e "SET CLUSTER SETTING kv.rangefeed.enabled = true"
          # SET CLUSTER SETTING cannot run inside a multi-statement batch, so 0003 is applied
          # statement-by-statement; the rest of the migrations pipe in whole.
          for f in db/migrations/0001_schema.sql db/migrations/0002_roles.sql; do
            docker exec -i crdb ./cockroach sql --insecure -d erasure < "$f"
          done
          docker exec crdb ./cockroach sql --insecure -d erasure -e "SET CLUSTER SETTING feature.vector_index.enabled = true"
          docker exec crdb ./cockroach sql --insecure -d erasure -e "SET sql_safe_updates = false; CREATE VECTOR INDEX IF NOT EXISTS mem_idx ON agent_memory (subject_id, embedding)"
          for f in db/migrations/0004_rls.sql db/migrations/0005_proof_document.sql; do
            docker exec -i crdb ./cockroach sql --insecure -d erasure < "$f"
          done
      - name: Install cryptod deps
        working-directory: services/cryptod
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]" 'moto[server]'
      - name: Install web deps + Playwright
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Warm the Go build cache (so the script's go run starts fast)
        working-directory: services/api
        run: go build ./...
      - name: Bring up the real stack (moto + cryptod + api)
        run: bash deploy/local/realstack-ci.sh up
      - name: Real-stack browser E2E (zero mocks)
        working-directory: web
        run: npx playwright test --config playwright.realstack.config.ts
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-realstack-report
          path: web/playwright-report/
          retention-days: 7

  mobile:
    # The offline Erasure Proof Verifier (Expo/React Native). Typecheck + the crypto-parity test
    # that proves the on-device @noble/curves verifier agrees with the backend signer byte-for-byte
    # (and rejects tampered / wrong-key / malformed certificates).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Verify parity + tamper tests
        run: npm test
